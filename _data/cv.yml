# CV page content (rendered by _layouts/cv.liquid). Keep in sync with the LaTeX CV PDF.

- title: Profile
  type: list
  contents:
    - >-
      I am a second-year PhD candidate at the Information Engineering Lab (ieLab), The University of Queensland, supervised by
      Dr. Teerapong Leelanupab and Prof. Guido Zuccon. My research focuses on <b>optimising retrieval for deep research agents</b>:
      both building retrieval systems that better serve agents and helping agents make better use of retrieval.
      I am also interested in LLM-based ranking and retrieval-augmented generation.

